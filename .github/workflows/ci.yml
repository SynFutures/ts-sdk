name: CI

on:
    pull_request:
        branches:
            - main
    workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    test:
        name: Lint & Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6.0.2
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false
            - name: Setup Minimum Consumer Runtime
              uses: actions/setup-node@v6.2.0
              with:
                  node-version: '22'
            - name: Save Minimum Runtime Path
              id: consumer-runtime
              run: echo "node=$(command -v node)" >> "$GITHUB_OUTPUT"
            - name: Setup Node
              uses: actions/setup-node@v6.2.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - name: Creating .npmrc
              env:
                  REGISTRY_URL: ${{ secrets.NPM_REGISTRY_URL }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  # Validate required secrets
                  if [ -z "$REGISTRY_URL" ]; then
                    echo "::error::NPM_REGISTRY_URL secret is not set"
                    exit 1
                  fi
                  if [ -z "$NPM_TOKEN" ]; then
                    echo "::error::NPM_TOKEN secret is not set"
                    exit 1
                  fi

                  # Extract host+path from registry URL for auth token key
                  # npm/pnpm auth token key format is //host/path/:_authToken
                  # This works for both simple domains and URLs with paths (e.g., Nexus)
                  # Examples:
                  #   https://registry.example.com -> registry.example.com
                  #   https://nexus.example.com/repository/npm/ -> nexus.example.com/repository/npm/
                  REGISTRY_HOST_PATH=$(echo "$REGISTRY_URL" | sed -E 's|^https?://||' | sed -E 's|/$||')

                  # Write .npmrc using printf to safely handle special characters in token
                  {
                    printf '@synfutures:registry=%s\n' "$REGISTRY_URL"
                    printf '@derivation-tech:registry=%s\n' "$REGISTRY_URL"
                    printf '//%s/:_authToken=%s\n' "$REGISTRY_HOST_PATH" "$NPM_TOKEN"
                  } > "$HOME/.npmrc"
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Check Formatting
              run: pnpm run format:check
            - name: Lint Workspace
              run: pnpm run lint
            - name: Test Release Tooling
              run: pnpm run test:release
            - name: Verify PerpV3 Package
              run: pnpm -C packages/perpv3-ts run verify
            - name: Devnet Tests
              run: pnpm -C packages/perpv3-ts run test:devnet
            - name: Verify Node 22 Packed Consumer
              env:
                  PERPV3_CONSUMER_NODE: ${{ steps.consumer-runtime.outputs.node }}
              run: pnpm -C packages/perpv3-ts run verify:consumer
