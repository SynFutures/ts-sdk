name: CI

on:
    pull_request:
        branches:
            - main
    workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    test:
        name: Lint & Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6.0.2
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false
            - name: Setup Minimum Consumer Runtime
              uses: actions/setup-node@v6.2.0
              with:
                  node-version: '22'
            - name: Save Minimum Runtime Path
              id: consumer-runtime
              run: echo "node=$(command -v node)" >> "$GITHUB_OUTPUT"
            - name: Setup Node
              uses: actions/setup-node@v6.2.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - name: Configure private registry
              env:
                  NPM_REGISTRY_URL: ${{ secrets.NPM_REGISTRY_URL }}
              run: node scripts/configure-registry.cjs
            - name: Install Dependencies
              env:
                  NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/perpv3-registry.npmrc
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: pnpm install --frozen-lockfile
            - name: Check Formatting
              run: pnpm run format:check
            - name: Lint Workspace
              run: pnpm run lint
            - name: Test Release Tooling
              run: pnpm run test:release
            - name: Verify PerpV3 Package
              run: pnpm -C packages/perpv3-ts run verify
            - name: Devnet Tests
              run: pnpm -C packages/perpv3-ts run test:devnet
            - name: Verify Node 22 Packed Consumer
              env:
                  PERPV3_CONSUMER_NODE: ${{ steps.consumer-runtime.outputs.node }}
              run: pnpm -C packages/perpv3-ts run verify:consumer
