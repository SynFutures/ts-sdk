name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Creating .npmrc
        run: |
          REGISTRY_URL="${{ secrets.NPM_REGISTRY_URL }}"
          # Extract host+path from registry URL for auth token key
          # npm/pnpm auth token key format is //host/path/:_authToken
          # This works for both simple domains and URLs with paths (e.g., Nexus)
          # Examples:
          #   https://registry.example.com -> registry.example.com
          #   https://nexus.example.com/repository/npm/ -> nexus.example.com/repository/npm/
          REGISTRY_HOST_PATH=$(echo "$REGISTRY_URL" | sed -E 's|^https?://||' | sed -E 's|/$||')
          cat << EOF > "$HOME/.npmrc"
          @synfutures:registry=$REGISTRY_URL
          //$REGISTRY_HOST_PATH/:_authToken=${{ secrets.NPM_TOKEN }}
          EOF
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run nx
