name: Changesets

on:
    push:
        branches:
            - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6.0.2
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false
            - name: Setup Node
              uses: actions/setup-node@v6.2.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - name: Configure private registry
              env:
                  NPM_REGISTRY_URL: ${{ secrets.NPM_REGISTRY_URL }}
              run: node scripts/configure-registry.cjs
            - name: Install Dependencies
              env:
                  NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/perpv3-registry.npmrc
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: pnpm install --frozen-lockfile
            - name: Lint Workspace
              run: pnpm run lint
            - name: Test Release Tooling
              run: pnpm run test:release
            - name: Verify PerpV3 Package
              run: pnpm -C packages/perpv3-ts run verify
            - name: Create Release Pull Request or Publish to npm
              id: changesets
              uses: changesets/action@v2
              with:
                  version-script: pnpm run release:version
                  publish-script: pnpm run release
                  github-token: ${{ secrets.GITHUB_TOKEN }}
              env:
                  NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/perpv3-registry.npmrc
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
